<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacySync Layout Editor</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #07090d; --panel: #0f151e; --panel2: #162030; --field: #080c12; --edge: #263243; --steel: #7d8a9c;
  --silver: #c3ccd8; --blue: #2563c9; --blue2: #4c9dff; --ice: #a8d4ff; --ink: #e4ebf3; --soft: #a3b1c2;
  --muted: #5a6879; --ok: #2fbf71; --err: #ff5468; --warn: #f5b84c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 Inter, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--edge); background: #0a0f16; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: .2px; margin-right: 8px; white-space: nowrap; }
.brand b { color: var(--blue2); }
.brand small { font: 500 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-left: 8px; }
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; height: 24px; background: var(--edge); margin: 0 4px; }
button, select, input { font: inherit; color: var(--ink); }
button { background: var(--panel2); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--blue2); }
button.primary { background: var(--blue); border-color: var(--blue2); font-weight: 600; }
button.on { background: #12305e; border-color: var(--blue2); color: var(--ice); }
button:disabled { opacity: .45; cursor: default; }
select, input[type=number], input[type=text] { background: var(--field); border: 1px solid var(--edge); border-radius: 7px; padding: 5px 7px; }
input[type=number] { width: 74px; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; background: radial-gradient(circle at 30% 20%, #111a26, #06080c 70%); }
#svg { width: 100%; height: 100%; display: block; user-select: none; }
aside { width: 340px; flex: none; border-left: 1px solid var(--edge); background: #0a0f16; overflow-y: auto; padding: 12px 14px 40px; }
aside h3 { font: 700 11px ui-monospace, Menlo, monospace; letter-spacing: 1.4px; color: var(--blue2); margin: 16px 0 8px; text-transform: uppercase; }
aside h3:first-child { margin-top: 2px; }
.row { display: flex; gap: 8px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
.row label { color: var(--soft); min-width: 62px; }
.hint { color: var(--muted); font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 9px 10px; margin: 6px 0; }
.chip { display: inline-block; background: var(--panel2); border-radius: 6px; padding: 1px 7px; margin: 2px 3px 2px 0; font: 500 11px ui-monospace, Menlo, monospace; color: var(--ice); }
kbd { font: 600 11px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--silver); }
.keys div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #1a2433; }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #0f1b2c; border: 1px solid var(--blue2); border-radius: 10px; padding: 9px 14px; display: none; max-width: 80%; box-shadow: 0 10px 40px #000a; }
#toast.err { border-color: var(--err); }
#lang { position: fixed; top: 10px; right: 14px; z-index: 10; background: var(--panel2); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 6px; display: flex; gap: 2px; }
#lang button { border: 0; border-radius: 999px; padding: 3px 10px; background: transparent; font-weight: 700; font-size: 12px; }
#lang button.on { background: var(--blue); }
header .bar:last-of-type { margin-right: 110px; }
#mode { font: 600 11px ui-monospace, Menlo, monospace; color: var(--warn); }
.tip { position: fixed; z-index: 20; max-width: 300px; background: #0d1622; border: 1px solid var(--edge); border-radius: 9px; padding: 8px 10px; color: var(--soft); font-size: 12px; pointer-events: none; display: none; box-shadow: 0 8px 30px #000b; }
.tip b { color: var(--ink); }
svg text { font-family: Inter, -apple-system, sans-serif; }
.ent { cursor: move; }
.pt { cursor: pointer; }
.handle { cursor: nwse-resize; }
</style>
</head>
<body>
<header>
  <div class="brand">Macy<b>~</b>Sync <small data-t="subtitle">layout editor</small></div>
  <div class="bar">
    <button id="bUndo" data-t="undo" data-tip="tipUndo">Undo</button>
    <button id="bRedo" data-t="redo" data-tip="tipRedo">Redo</button>
    <div class="sep"></div>
    <button id="bGroup" data-t="group" data-tip="tipGroup">Group</button>
    <button id="bUngroup" data-t="ungroup" data-tip="tipUngroup">Ungroup</button>
    <button id="bPoints" data-t="editPoints" data-tip="tipPoints">Edit points</button>
    <button id="bSnap" class="on" data-t="snap" data-tip="tipSnap">Snap</button>
    <span id="mode"></span>
  </div>
  <div class="bar" style="margin-left:auto">
    <select id="scene" data-tip="tipScene">
      <option value="connect">connect</option><option value="device">device</option><option value="sending">sending</option>
      <option value="receiving">receiving</option><option value="request">request</option><option value="models">models</option>
    </select>
    <button id="bPreview" data-t="preview" data-tip="tipPreview">Render preview</button>
    <button id="bApp" data-t="openApp" data-tip="tipApp">Open app</button>
    <div class="sep"></div>
    <button id="bExport" data-t="export" data-tip="tipExport">Export JSON</button>
    <button id="bSave" class="primary" data-t="save" data-tip="tipSave">Save</button>
  </div>
</header>
<div id="lang"><button data-lang="en">EN</button><button data-lang="tr">TR</button></div>
<main>
  <section id="stage">
    <svg id="svg" viewBox="-40 -30 1360 840" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="clip"><path id="clipShape"/></clipPath>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff08"/></pattern>
      </defs>
      <rect x="0" y="0" width="1280" height="780" fill="url(#grid)" stroke="#ffffff18" stroke-dasharray="6 6"/>
      <path id="body" fill="#0a0e14" fill-opacity=".9"/>
      <g id="lines" clip-path="url(#clip)"></g>
      <g id="conduitG"></g>
      <g id="bandsG"></g>
      <g id="elems"></g>
      <path id="outline" fill="none" stroke="#7d8a9c" stroke-width="1.5"/>
      <path id="outlineHit" fill="none" stroke="transparent" stroke-width="14" class="ent" data-id="outline"/>
      <image id="ref" x="0" y="0" width="1280" height="780" opacity="0" preserveAspectRatio="none" pointer-events="none"/>
      <g id="ptsG"></g>
      <g id="xform"></g>
      <rect id="marquee" fill="#4c9dff18" stroke="#4c9dff" stroke-dasharray="4 3" display="none"/>
    </svg>
    <div id="toast"></div>
  </section>
  <aside>
    <h3 data-t="selection">Selection</h3>
    <div id="inspector" class="card"></div>
    <h3 data-t="groups">Groups</h3>
    <div id="groups"></div>
    <h3 data-t="flowTitle">Background lines</h3>
    <div class="card" id="flowBox"></div>
    <h3 data-t="view">View</h3>
    <div class="card">
      <div class="row"><label data-t="reference">Reference</label>
        <select id="refSel"><option value="" data-t="none">none</option><option value="preview" data-t="lastPreview">last preview</option>
        <option value="connect.png">connect</option><option value="device.png">device</option><option value="sending.png">sending</option><option value="receiving.png">receiving</option><option value="request.png">request</option></select></div>
      <div class="row"><label data-t="opacity">Opacity</label><input id="refOp" type="range" min="0" max="1" step=".05" value=".5"></div>
      <div class="row"><label><input type="checkbox" id="showLines" checked> <span data-t="showLines">Lines</span></label>
        <label><input type="checkbox" id="showDialog"> <span data-t="showDialog">Dialog</span></label></div>
    </div>
    <h3 data-t="keys">Keys</h3>
    <div class="card keys" id="keys"></div>
    <h3 data-t="howTitle">How it is applied</h3>
    <div class="card hint" data-t="howText"></div>
  </aside>
</main>
<div class="tip" id="tip"></div>
<script id="fallback" type="application/json">__LAYOUT__</script>

    tipExport: "<b>JSON indir</b>: Kaydet'in yazdığı layout.json dosyasının aynısını indirir.", tipSave: "<b>Kaydet</b> (⌘S): assets/layout.json'u yazar; öncekini tools/layout-backups'ta saklar.",
    kSelect: "Seç, seçime ekle", kMarquee: "Kutudaki her şeyi seç", kMove: "Seçimi taşı", kNudge: "1 px kaydır (⇧ 10 px)",
    kScale: "Ölçekle (köşede ⇧ oranı korur)", kRotate: "Döndür (⇧ 15° adımla)", kPoints: "Dış hattın noktalarını düzenle", kAdd: "Çizgiye nokta ekle",

  },
};
let lang = "en";
try { lang = localStorage.getItem("mcy-editor-lang") || "en"; } catch (e) {}
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const LAPTOP_H = 0.935, LID = 0.655;
const ELEMS = ["title", "laptop_left", "laptop_right", "actions", "left_panel", "right_panel", "controls", "dialog"];
const BANDS = ["left", "bridge", "right"];
let L = null, saved = "";
let sel = new Set();              // entity ids
let mode = "object", target = null; // point editing: "outline" | "conduit"
let selPts = new Set();
let hist = [], fut = [];
let snap = true;
let previewUrl = "";

const clone = o => JSON.parse(JSON.stringify(o));
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const snapv = v => snap ? Math.round(v / 4) * 4 : Math.round(v * 10) / 10;
const r1 = v => Math.round(v * 10) / 10;

function toast(msg, err) {
  const d = document.getElementById("toast");
  d.textContent = msg; d.className = err ? "err" : ""; d.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => d.style.display = "none", err ? 7000 : 3500);
}

// Geometry ----------------------------------------------------------------------------------------------
function segs(o) {
  const n = o.length, out = [];
  for (let i = 0; i < n; i++) {
    const p0 = o[(i + n - 1) % n], p1 = o[i], p2 = o[(i + 1) % n], p3 = o[(i + 2) % n];
    out.push([p1, [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6], p2]);
  }
  return out;
}
const pathOf = o => "M" + o[0].join(" ") + segs(o).map(s => ` C${s[1].join(" ")} ${s[2].join(" ")} ${s[3].join(" ")}`).join("") + "Z";
function bez(s, u) { const v = 1 - u, k = [v * v * v, 3 * v * v * u, 3 * v * u * u, u * u * u]; return [0, 1].map(j => k[0] * s[0][j] + k[1] * s[1][j] + k[2] * s[2][j] + k[3] * s[3][j]); }
function sampled(o) { const pts = []; segs(o).forEach((s, i) => { for (let k = 0; k < 16; k++) pts.push({ p: bez(s, k / 16), i }); }); return pts; }
function hash(n) {
  let x = (Math.imul(n, 0x9E3779B9) ^ 0x85EBCA6B) >>> 0;
  x = (x ^ (x >>> 15)) >>> 0; x = Math.imul(x, 0x2C1B3C6D) >>> 0; x = (x ^ (x >>> 12)) >>> 0;
  return (x & 0xFFFF) / 65535;
}
const bandX = b => b === "left" ? 200 : b === "right" ? 1100 : (L.flow.into_bridge[1] + L.flow.into_right[0]) / 2;

function bbox(id) {
  if (id === "outline") { const ps = sampled(L.outline).map(s => s.p); return boxOf(ps); }
  if (id === "conduit") return boxOf(L.conduit, 16);
  if (id.startsWith("band:")) { const b = L.flow[id.slice(5)], x = bandX(id.slice(5)); return { x: x - 12, y: b.y - b.spread, w: 24, h: 2 * b.spread }; }
  const r = L.elements[id]; return { x: r.x, y: r.y, w: r.w, h: r.h };
}
function boxOf(ps, pad = 0) {
  const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);
  const x = Math.min(...xs) - pad, y = Math.min(...ys) - pad;
  return { x, y, w: Math.max(...xs) + pad - x, h: Math.max(...ys) + pad - y };
}
function union(boxes) {
  if (!boxes.length) return null;
  const x = Math.min(...boxes.map(b => b.x)), y = Math.min(...boxes.map(b => b.y));
  return { x, y, w: Math.max(...boxes.map(b => b.x + b.w)) - x, h: Math.max(...boxes.map(b => b.y + b.h)) - y };
}
const visible = id => id !== "dialog" || document.getElementById("showDialog").checked;
const allIds = () => ["outline", "conduit", ...ELEMS.filter(visible), ...BANDS.map(b => "band:" + b)];
const groupOf = id => (L.groups || []).find(g => g.includes(id));
const ptsOf = tg => tg === "outline" ? L.outline : L.conduit;

// The selection's transform, applied to a base copy so a drag never accumulates rounding.
function transform(base, fn, ids, pts) {
  const out = clone(base);
  const mapP = p => fn(p);
  if (pts) {
    const src = target === "outline" ? base.outline : base.conduit, dst = target === "outline" ? out.outline : out.conduit;
    pts.forEach(i => { const q = mapP(src[i]); dst[i] = [snapv(q[0]), snapv(q[1])]; });
    return out;
  }
  for (const id of ids) {
    if (id === "outline") out.outline = base.outline.map(p => { const q = mapP(p); return [snapv(q[0]), snapv(q[1])]; });
    else if (id === "conduit") out.conduit = base.conduit.map(p => { const q = mapP(p); return [snapv(q[0]), snapv(q[1])]; });

    let sx = h.includes("e") || h.includes("w") ? (p[0] - ox) / ((h.includes("w") ? b.x : b.x + b.w) - ox) : 1;
    let sy = h.includes("n") || h.includes("s") ? (p[1] - oy) / ((h.includes("n") ? b.y : b.y + b.h) - oy) : 1;
    if (ev.shiftKey && h.length === 2) { const s = Math.max(Math.abs(sx), Math.abs(sy)); sx = Math.sign(sx || 1) * s; sy = Math.sign(sy || 1) * s; }
    if (!isFinite(sx) || Math.abs(sx) < .05) sx = .05; if (!isFinite(sy) || Math.abs(sy) < .05) sy = .05;
    fn = scaleFn(sx, sy, ox, oy);
  } else {
    const c = [d.b.x + d.b.w / 2, d.b.y + d.b.h / 2];
    let a = Math.atan2(p[1] - c[1], p[0] - c[0]) - Math.atan2(d.start[1] - c[1], d.start[0] - c[0]);
    if (ev.shiftKey) a = Math.round(a / (Math.PI / 12)) * (Math.PI / 12);
    fn = rotFn(a, c[0], c[1]);
  }
  L = transform(d.base, fn, d.ids || [...sel], d.pts);
  render();
});

svg.addEventListener("pointerup", ev => {
  const d = drag; drag = null; if (!d) return;
  if (d.kind === "marquee") {
    document.getElementById("marquee").setAttribute("display", "none");
    if (d.box && d.box.w > 3 && d.box.h > 3) {
      const inside = b => b.x < d.box.x + d.box.w && b.x + b.w > d.box.x && b.y < d.box.y + d.box.h && b.y + b.h > d.box.y;
      if (mode === "points") {
        if (!d.add) selPts = new Set();
        ptsOf(target).forEach((q, i) => { if (q[0] >= d.box.x && q[0] <= d.box.x + d.box.w && q[1] >= d.box.y && q[1] <= d.box.y + d.box.h) selPts.add(i); });
      } else {
        if (!d.add) sel = new Set();
        allIds().filter(i => inside(bbox(i))).forEach(i => (groupOf(i) || [i]).forEach(u => sel.add(u)));
      }
    } else if (!d.add) { if (mode === "points") selPts = new Set(); else sel = new Set(); }
    render(); return;
  }
  if (JSON.stringify(L) !== d.before) commit(d.before);
  render();
});

svg.addEventListener("dblclick", ev => {
  // Pointer capture makes the svg the click target, so look up what is under the pointer.
  const p = pt(ev), tg = document.elementFromPoint(ev.clientX, ev.clientY) || ev.target;
  const id = tg.closest && tg.closest("[data-id]") ? tg.closest("[data-id]").dataset.id : null;
  if (mode === "points") {
    if (target === "outline" && (id === "outline" || tg.id === "outline")) {
      // A new point on the line, between the two points around the nearest spot.
      const near = sampled(L.outline).reduce((best, s) => { const dd = Math.hypot(s.p[0] - p[0], s.p[1] - p[1]); return dd < best.d ? { d: dd, i: s.i } : best; }, { d: 1e9, i: 0 });
      change(() => L.outline.splice(near.i + 1, 0, [snapv(p[0]), snapv(p[1])]));
      selPts = new Set([near.i + 1]); render();
    }
    return;
  }
  if (id === "outline" || id === "conduit") { enterPoints(id); return; }
  if (id && groupOf(id)) { sel = new Set([id]); render(); }
});

function enterPoints(tg) { mode = "points"; target = tg; selPts = new Set(); sel = new Set([tg]); render(); }
function exitPoints() { mode = "object"; selPts = new Set(); sel = new Set(target ? [target] : []); target = null; render(); }

// Keys and buttons --------------------------------------------------------------------------------------
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  const cmd = ev.metaKey || ev.ctrlKey, k = ev.key;
  if (cmd && k.toLowerCase() === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (cmd && k.toLowerCase() === "g") { ev.preventDefault(); ev.shiftKey ? ungroup() : group(); return; }
  if (cmd && k.toLowerCase() === "s") { ev.preventDefault(); save(); return; }
  if (k === "Escape") { mode === "points" ? exitPoints() : (sel = new Set(), render()); return; }
  if (k === "Enter" && mode === "object" && sel.size === 1 && (sel.has("outline") || sel.has("conduit"))) { enterPoints([...sel][0]); return; }
  if (k === "g" || k === "G") { snap = !snap; document.getElementById("bSnap").classList.toggle("on", snap); return; }
  if ((k === "Delete" || k === "Backspace") && mode === "points" && target === "outline" && selPts.size) {
    ev.preventDefault();
    if (L.outline.length - selPts.size < 4) return toast("4+", true);
    change(() => { L.outline = L.outline.filter((_, i) => !selPts.has(i)); }); selPts = new Set(); render(); return;
  }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[k]) {
    ev.preventDefault();
    const n = ev.shiftKey ? 10 : 1, [dx, dy] = arrows[k].map(v => v * n), was = snap; snap = false;
    change(() => { L = mode === "points" ? transform(L, moveFn(dx, dy), null, [...selPts]) : transform(L, moveFn(dx, dy), [...sel]); });
    snap = was;
  }
});
function group() {
  const ids = [...sel]; if (ids.length < 2) return;
  change(() => { L.groups = (L.groups || []).filter(g => !g.some(i => ids.includes(i))); L.groups.push(ids); });
}
function ungroup() { change(() => { L.groups = (L.groups || []).filter(g => !g.some(i => sel.has(i))); }); }

async function save() {
  try {
    const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ layout: L }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    saved = JSON.stringify(L); toast(t("saved"));
  } catch (e) { toast(location.protocol === "file:" ? t("noServer") : t("saveFail") + e.message, true); }
}
function exportJson() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(L, null, 2) + "\n"], { type: "application/json" }));
  a.download = "layout.json"; a.click(); toast(t("exported"));
}
async function preview() {
  toast(t("rendering"));
  try {
    const r = await fetch("/render", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ layout: L, scene: document.getElementById("scene").value }) });
    if (!r.ok) { let m = r.status; try { m = (await r.json()).error; } catch (e) {} throw new Error(m); }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(await r.blob());
    document.getElementById("refSel").value = "preview"; setRef(); toast(t("rendered"));
  } catch (e) { toast(location.protocol === "file:" ? t("noServer") : t("renderFail") + e.message, true); }
}
async function openApp() {
  toast(t("launching"));
  try {
    const r = await fetch("/launch", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    toast(t(j.running ? "running" : "launched"));
  } catch (e) { toast(location.protocol === "file:" ? t("noServer") : t("launchFail") + e.message, true); }
}
function setRef() {
  const v = document.getElementById("refSel").value, img = document.getElementById("ref");
  const src = v === "preview" ? previewUrl : v ? "/shots/" + v : "";
  img.setAttribute("href", src);
  img.setAttribute("opacity", src ? document.getElementById("refOp").value : 0);
}

document.getElementById("bUndo").onclick = undo;
document.getElementById("bRedo").onclick = redo;
document.getElementById("bGroup").onclick = group;
document.getElementById("bUngroup").onclick = ungroup;
document.getElementById("bPoints").onclick = () => mode === "points" ? exitPoints() : enterPoints(sel.has("conduit") && !sel.has("outline") ? "conduit" : "outline");
document.getElementById("bSnap").onclick = () => { snap = !snap; document.getElementById("bSnap").classList.toggle("on", snap); };
document.getElementById("bSave").onclick = save;
document.getElementById("bExport").onclick = exportJson;
document.getElementById("bPreview").onclick = preview;
document.getElementById("bApp").onclick = openApp;
document.getElementById("refSel").onchange = setRef;
document.getElementById("refOp").oninput = setRef;
document.getElementById("showLines").onchange = render;
document.getElementById("showDialog").onchange = () => { if (!document.getElementById("showDialog").checked) sel.delete("dialog"); render(); };
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("mcy-editor-lang", lang); } catch (e) {} applyLang(); });
window.addEventListener("resize", render);
window.addEventListener("beforeunload", e => { if (saved && JSON.stringify(L) !== saved) { e.preventDefault(); e.returnValue = ""; } });

// Hover help: hover shows it; a click pins it until the next click or Esc.
const tip = document.getElementById("tip"); let pinned = false;
document.querySelectorAll("[data-tip]").forEach(e => {
  e.addEventListener("mouseenter", () => { if (pinned) return; tip.innerHTML = t(e.dataset.tip); tip.style.display = "block"; const r = e.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - 320, r.left) + "px"; tip.style.top = r.bottom + 8 + "px"; });
  e.addEventListener("mouseleave", () => { if (!pinned) tip.style.display = "none"; });
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = false; tip.style.display = "none"; } });

(async () => {
  try { const r = await fetch("/layout", { cache: "no-store" }); if (!r.ok) throw 0; L = await r.json(); }
  catch (e) {
    try { L = JSON.parse(document.getElementById("fallback").textContent); }
    catch (e2) { applyLangLite(); toast(t("noServer"), true); return; }
  }
  L.groups = L.groups || [];
  if (!L.elements.actions) {
    // Layouts saved before the Send / Receive buttons existed: put them on the conduit's middle, as the app does.
    const m = bez(L.conduit, .5);
    L.elements.actions = { x: Math.round(m[0] - 60), y: Math.round(m[1] - 75), w: 120, h: 150 };
  }
  saved = JSON.stringify(L);
  applyLang();
})();
</script>
